name: Pages

# Publishes the example as a static site: the Jaspr export and the Flutter build of
# the same node tree, with a landing page that shows them side by side.
#
# One-time setup, and the only step a workflow cannot do: Settings -> Pages ->
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5
  # The address the site is served from. A project site lives under /<repo>/.
  SITE_URL: https://cedvdb.github.io/unibox/

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify the workspace
        run: tool/verify.sh
      - name: Build the pages
        run: tool/site.sh --base=/unibox/ --url="$SITE_URL"
      - uses: actions/configure-pages@v5
        with:
          # Enables Pages with "GitHub Actions" as its source when it is not enabled
          # yet, so the first push does not need a manual visit to the settings.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
