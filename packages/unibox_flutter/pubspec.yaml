name: unibox_flutter
description: Renders Unibox layout primitives as Flutter widgets, with inherited typography, interaction states and semantics.
publish_to: none
version: 0.1.0
repository: https://github.com/cedvdb/unibox
homepage: https://github.com/cedvdb/unibox
issue_tracker: https://github.com/cedvdb/unibox/issues
topics:
  - layout
  - ui
  - widget
  - cross-platform
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  unibox_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  unibox_testing: ^0.1.0
